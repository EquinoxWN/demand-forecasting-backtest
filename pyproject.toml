[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "demand-forecasting-backtest"
version = "0.1.0"
description = "M5 demand data prepared with calendar, price and promotion features at item, store and total level, scored against a seasonal-naive baseline."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["numpy>=2.3", "pandas>=2.3"]

[project.optional-dependencies]
dev = [
  "pytest>=9.2",
  "pytest-timeout>=2.4",
  "ruff>=0.17",
  "mypy>=2.4",
  "pandas-stubs>=2.3",
  "pip-audit>=2.10",
]

[project.scripts]
dfb = "demand_forecasting_backtest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 300

[tool.ruff]
line-length = 100
extend-exclude = [".tmp", ".venv", "data"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "N", "C4", "PT", "RET", "PIE", "PERF", "BLE"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311"]

[tool.mypy]
strict = true
files = ["src", "tests"]
